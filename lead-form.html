<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SMB Lead Form — Spiel Ventures</title>
<link rel="stylesheet" href="lead-form.css"/>
</head>
<body style="margin:0;background:#0f1419;padding:2rem 1rem">
<form class="spiel-lead" action="mailto:you@example.com?subject=Website%20lead" method="post" enctype="text/plain">
  <strong>Get a quote</strong>
  <label for="name">Name</label>
  <input id="name" name="name" required autocomplete="name"/>
  <label for="phone">Phone</label>
  <input id="phone" name="phone" type="tel" required autocomplete="tel"/>
  <label for="need">What do you need?</label>
  <textarea id="need" name="need" rows="3" required></textarea>
  <button type="submit">Send</button>
  <p class="hint">Keep ≤3 fields on mobile. Replace mailto with your endpoint. Component by Spiel Ventures.</p>
</form>
</body>
</html>
